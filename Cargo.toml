[package]
name = "tages-tur"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
askama = "0.15.6"
axum = "0.8.9"
jord = "0.16.0"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.47", features = ["formatting"] }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }
